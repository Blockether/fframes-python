[project]
name = "vis-fframes"
version = "0.1.0"
description = "Make videos in Python with fframes: scaffold, inspect, render frames and video."
keywords = ["video", "fframes"]
requires-python = ">=3.12"
dependencies = ["vis-agent>=0.5.7"]

[tool.vis]
category = "tools"
source_paths = ["src"]
skills = ["skills/fframes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
