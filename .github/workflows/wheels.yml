name: Wheels

# Builds the fframes wheel for each platform, repairs it so that it holds its own FFmpeg and
# codec libraries, and runs tools/smoke.py with the installed wheel. A v* tag also publishes
# the wheels in the GitHub release of that tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  wheel:
    name: Wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: linux-x86_64
            os: ubuntu-22.04
            plat: manylinux_2_35_x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            plat: manylinux_2_35_aarch64
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # The Homebrew codec libraries of the runner are built for macOS 15.
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm nasm yasm pkg-config libx264-dev libx265-dev \
            libvpx-dev libopus-dev libfontconfig1-dev libfreetype-dev libasound2-dev libwayland-dev

      - name: Install the macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config nasm x264 x265 libvpx opus

      # Windows links a prebuilt shared FFmpeg, as the fframes CI does.
      - name: Install FFmpeg 9
        if: runner.os == 'Windows'
        env:
          FFMPEG_BUILD: ffmpeg-n9.0-latest-win64-gpl-shared-9.0
        run: |
          TMP_DIR="$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSL -o "$TMP_DIR/ffmpeg.zip" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$FFMPEG_BUILD.zip"
          7z x "$TMP_DIR/ffmpeg.zip" -o"$TMP_DIR" > /dev/null
          FFMPEG_DIR="$(cygpath -w "$TMP_DIR/$FFMPEG_BUILD")"
          echo "FFMPEG_DIR=$FFMPEG_DIR" >> "$GITHUB_ENV"
          echo "$FFMPEG_DIR\bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wheel-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build the wheel
        run: |
          python -m pip install "maturin>=1.9,<2"
          maturin build --release --out raw

      - name: Bundle the shared libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install delocate
          delocate-wheel -v -w dist raw/*.whl

      - name: Bundle the shared libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install auditwheel patchelf
          auditwheel repair --plat "${{ matrix.plat }}" -w dist raw/*.whl

      - name: Bundle the shared libraries (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install delvewheel
          delvewheel repair --add-path "$FFMPEG_DIR\bin" -w dist raw/*.whl

      - name: Test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/smoke/Scripts/python.exe"; else py="$RUNNER_TEMP/smoke/bin/python"; fi
          "$py" -m pip install dist/*.whl
          # No FFmpeg of the build machine on the path: the wheel must hold its own.
          if [ "$RUNNER_OS" = Windows ]; then
            PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi ffmpeg | paste -sd:)"
            export PATH
          fi
          "$py" tools/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Publish the wheels
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check that the tag matches the declared version
        run: |
          set -euo pipefail
          declared=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $declared." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
